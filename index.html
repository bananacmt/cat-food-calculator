
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓食磷與灰質健康計算機 (終極修正版)</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; line-height: 1.6; }
        .container { max-width: 580px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2b7a78; margin-bottom: 25px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .row { display: flex; gap: 12px; }
        .row .input-group { flex: 1; }
        button { width: 100%; padding: 14px; background-color: #2b7a78; color: white; border: none; border-radius: 6px; font-size: 17px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1f5f5c; }
        .result { margin-top: 30px; padding: 22px; border-radius: 8px; display: none; border: 1px solid #ddd; background-color: #fafafa; }
        .section-title { font-weight: bold; font-size: 17px; margin: 18px 0 8px; border-bottom: 1px solid #eee; padding-bottom: 6px; color: #222; }
        .status-box { padding: 10px 14px; border-radius: 6px; margin-top: 6px; font-weight: bold; }
        .good { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        #canWeightGroup { display: none; }
        .note { font-size: 13px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🐱 貓食磷與灰質計算機 (終極修正版)</h2>
    
    <div class="input-group">
        <label>貓食名稱 / 口味</label>
        <input type="text" id="name" placeholder="例如：Kakato 吞拿魚慕絲">
    </div>

    <div class="row">
        <div class="input-group">
            <label>水分 (%)</label>
            <input type="number" id="moisture" step="0.1" placeholder="例如：81.4">
        </div>
        <div class="input-group">
            <label>熱量數值</label>
            <input type="number" id="kcalInput" placeholder="例如：100.8">
        </div>
    </div>

    <div class="row">
        <div class="input-group">
            <label>熱量單位</label>
            <select id="kcalType" onchange="toggleCanWeight()">
                <option value="kg">kcal / kg</option>
                <option value="g100">kcal / 100g</option>
                <option value="can">kcal / 每罐 (總熱量)</option>
            </select>
        </div>
        <div class="input-group" id="canWeightGroup">
            <label>單罐淨重 (g)</label>
            <input type="number" id="canWeight" placeholder="例如：70">
        </div>
    </div>

    <div class="input-group">
        <label>磷含量 (%)</label>
        <input type="number" id="phos" step="0.001" placeholder="例如：0.107">
        <div class="note">包裝上標示的磷百分比 (0.107 = 0.107%)</div>
    </div>

    <div class="row">
        <div class="input-group" style="flex: 1.3;">
            <label>灰質 (%)</label>
            <input type="number" id="ash" step="0.1" placeholder="例如：1.4">
        </div>
        <div class="input-group" style="flex: 2;">
            <label>灰質類型</label>
            <select id="ashType">
                <option value="wet">包裝標示 (As Fed)</option>
                <option value="dm">已轉乾物質 (DM)</option>
            </select>
        </div>
    </div>
    
    <button onclick="calculateNutrition()">開始計算 &amp; 分析</button>
    
    <div id="resultBox" class="result">
        <h3 id="resName" style="margin-top:0; color:#2b7a78;"></h3>
        
        <div class="section-title">🥩 磷含量分析 (mg/100kcal)</div>
        <div style="font-size:22px; font-weight:bold;" id="phosValue"></div>
        <div id="phosAdvice" class="status-box"></div>

        <div class="section-title">🦴 灰質分析 (乾物質基礎)</div>
        <div>乾物質灰質：<span id="ashDmValue" style="font-size:19px; font-weight:bold;"></span> %</div>
        <div id="ashAdvice" class="status-box"></div>
    </div>
</div>

<script>
function toggleCanWeight() {
    const kcalType = document.getElementById('kcalType').value;
    document.getElementById('canWeightGroup').style.display = (kcalType === 'can') ? 'block' : 'none';
}

function calculateNutrition() {
    const name = document.getElementById('name').value.trim() || '未命名貓食';
    const moisture = parseFloat(document.getElementById('moisture').value);
    const kcalInput = parseFloat(document.getElementById('kcalInput').value);
    const kcalType = document.getElementById('kcalType').value;
    const canWeight = parseFloat(document.getElementById('canWeight').value);
    const phos = parseFloat(document.getElementById('phos').value);
    const ash = parseFloat(document.getElementById('ash').value);
    const ashType = document.getElementById('ashType').value;

    if (isNaN(moisture) || moisture < 0 || moisture >= 100 || 
        isNaN(kcalInput) || kcalInput <= 0 || 
        isNaN(phos) || phos < 0) {
        alert('請正確填寫「水分 %」、「熱量數值」和「磷 %」！');
        return;
    }

    let mgPer100kcal = 0;

    // === 正確的磷計算公式（已修正差10倍問題）===
    if (kcalType === 'kg') {
        // phos% * 10000 = mg/kg
        mgPer100kcal = (phos * 10000 / kcalInput) * 100;
    } else if (kcalType === 'g100') {
        mgPer100kcal = (phos * 100000) / kcalInput;   // phos% * 1000 = mg/100g
    } else if (kcalType === 'can') {
        if (isNaN(canWeight) || canWeight <= 0) {
            alert('請輸入單罐淨重！');
            return;
        }
        mgPer100kcal = (phos * canWeight * 1000) / kcalInput;
    }

    mgPer100kcal = Math.round(mgPer100kcal * 10) / 10;

    // === 灰質乾物質換算 ===
    let ashDm = 0;
    if (!isNaN(ash) && ash >= 0) {
        if (ashType === 'wet') {
            ashDm = (ash / (100 - moisture)) * 100;
        } else {
            ashDm = ash;
        }
        ashDm = Math.round(ashDm * 10) / 10;
    }

    // === 顯示結果 ===
    document.getElementById('resName').innerText = name;
    document.getElementById('phosValue').innerText = mgPer100kcal + ' mg/100kcal';
    
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    // 磷判定
    const phosAdvice = document.getElementById('phosAdvice');
    if (mgPer100kcal < 150) {
        phosAdvice.className = 'status-box danger';
        phosAdvice.innerText = '🔴 磷過低 (<150)：長期可能導致礦物質缺乏，建議補充。';
    } else if (mgPer100kcal <= 250) {
        phosAdvice.className = 'status-box good';
        phosAdvice.innerText = '🟢 優質低磷 (≤250)：非常適合腎臟病或老貓！';
    } else if (mgPer100kcal <= 350) {
        phosAdvice.className = 'status-box warning';
        phosAdvice.innerText = '🟡 中磷 (251~350)：適合一般健康成貓，腎貓建議少吃。';
    } else {
        phosAdvice.className = 'status-box danger';
        phosAdvice.innerText = '🔴 高磷 (>350)：不適合腎病或老貓，僅適合幼貓。';
    }

    // 灰質判定
    const ashDmValue = document.getElementById('ashDmValue');
    const ashAdvice = document.getElementById('ashAdvice');
    if (isNaN(ash) || ash < 0) {
        ashDmValue.innerText = '--';
        ashAdvice.innerText = '未輸入灰質數據';
    } else {
        ashDmValue.innerText = ashDm;
        if (ashDm <= 7.0) {
            ashAdvice.className = 'status-box good';
            ashAdvice.innerText = '🟢 極佳 (<7% DM)：去骨肉等級，礦物質負擔低。';
        } else if (ashDm <= 9.0) {
            ashAdvice.className = 'status-box good';
            ashAdvice.innerText = '🟢 良好 (7~9% DM)：標準優質範圍。';
        } else if (ashDm <= 10.0) {
            ashAdvice.className = 'status-box warning';
            ashAdvice.innerText = '🟡 稍高 (9~10% DM)：注意飲水量。';
        } else {
            ashAdvice.className = 'status-box danger';
            ashAdvice.innerText = '🔴 過高 (>10% DM)：可能含大量骨粉，建議減少食用。';
        }
    }
}
</script>

</body>
</html>
